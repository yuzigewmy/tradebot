[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "crypto-spot-agent"
version = "0.1.0"
description = "可追溯的加密货币现货技术分析与持仓情景助手"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "numpy>=2,<3",
  "pandas>=2.2,<4",
  "TA-Lib>=0.6.5,<1",
  "ccxt>=4,<5",
  "plotly>=6,<7",
  "httpx>=0.27,<1",
  "python-dotenv>=1,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "playwright>=1.50,<2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
