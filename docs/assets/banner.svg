    <g stroke-width="1.5">
      <line x1="48" y1="140" x2="48" y2="180" stroke="#475569"/><rect x="43" y="150" width="10" height="22" rx="2" fill="#EF4444" fill-opacity="0.75"/>
      <line x1="84" y1="136" x2="84" y2="174" stroke="#475569"/><rect x="79" y="146" width="10" height="18" rx="2" fill="#10B981" fill-opacity="0.8"/>
      <line x1="120" y1="126" x2="120" y2="165" stroke="#475569"/><rect x="115" y="135" width="10" height="20" rx="2" fill="#10B981" fill-opacity="0.85"/>
      <line x1="156" y1="128" x2="156" y2="160" stroke="#475569"/><rect x="151" y="138" width="10" height="14" rx="2" fill="#EF4444" fill-opacity="0.75"/>
      <line x1="192" y1="112" x2="192" y2="152" stroke="#475569"/><rect x="187" y="120" width="10" height="22" rx="2" fill="#10B981" fill-opacity="0.9"/>
      <line x1="228" y1="98" x2="228" y2="136" stroke="#475569"/><rect x="223" y="106" width="10" height="22" rx="2" fill="#10B981" fill-opacity="0.9"/>
      <line x1="264" y1="102" x2="264" y2="134" stroke="#475569"/><rect x="259" y="110" width="10" height="16" rx="2" fill="#EF4444" fill-opacity="0.75"/>
      <line x1="300" y1="84" x2="300" y2="122" stroke="#475569"/><rect x="295" y="92" width="10" height="22" rx="2" fill="#10B981" fill-opacity="0.95"/>
      <line x1="336" y1="72" x2="336" y2="108" stroke="#475569"/><rect x="331" y="80" width="10" height="20" rx="2" fill="#10B981" fill-opacity="0.95"/>
      <line x1="372" y1="60" x2="372" y2="96" stroke="#475569"/><rect x="367" y="68" width="10" height="20" rx="2" fill="#34D399"/>
    </g>

    <!-- Smooth equity curve overlay -->
    <path d="M 32 178 C 80 168, 128 154, 174 148 C 220 142, 250 116, 296 102 C 340 88, 376 74, 412 58 L 412 198 L 32 198 Z" fill="url(#areaGrad)"/>
    <path d="M 32 178 C 80 168, 128 154, 174 148 C 220 142, 250 116, 296 102 C 340 88, 376 74, 412 58" fill="none" stroke="url(#lineGrad)" stroke-width="3" stroke-linecap="round"/>
    <circle cx="412" cy="58" r="5" fill="#6EE7B7" stroke="#0B1220" stroke-width="2"/>

    <!-- Bottom status pills inside preview card -->
    <g transform="translate(20, 206)" font-family="'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace" font-size="11">
      <text x="0" y="10" fill="#6EE7B7">4H EMA/ADX GATE</text>
      <text x="138" y="10" fill="#94A3B8">1H S4 + S3</text>
      <text x="236" y="10" fill="#FBBF24">3% RISK · 10x</text>
      <text x="352" y="10" fill="#CBD5E1">BINANCE</text>
