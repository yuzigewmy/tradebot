    <g transform="translate(0, 194)" font-family="'Inter',-apple-system,sans-serif" font-size="12" font-weight="600">
      <rect x="0" y="0" width="136" height="28" rx="14" fill="#1E293B" stroke="#334155"/>
      <text x="68" y="18" text-anchor="middle" fill="#E2E8F0">TA-Lib Indicators</text>

      <rect x="148" y="0" width="150" height="28" rx="14" fill="#064E3B" fill-opacity="0.7" stroke="#10B981" stroke-opacity="0.6"/>
      <text x="223" y="18" text-anchor="middle" fill="#6EE7B7">S10 Dual-Engine</text>

      <rect x="310" y="0" width="146" height="28" rx="14" fill="#1E293B" stroke="#334155"/>
      <text x="383" y="18" text-anchor="middle" fill="#E2E8F0">Binance Official SDK</text>

      <rect x="468" y="0" width="130" height="28" rx="14" fill="#1E293B" stroke="#334155"/>
      <text x="533" y="18" text-anchor="middle" fill="#E2E8F0">WeChat AI Bot</text>
