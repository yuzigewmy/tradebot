  <!-- Left brand & headline -->
  <g transform="translate(56, 56)">
    <rect x="0" y="0" width="44" height="44" rx="11" fill="#10B981" fill-opacity="0.16" stroke="#34D399" stroke-opacity="0.55" stroke-width="1.5"/>
    <text x="22" y="30" text-anchor="middle" fill="#6EE7B7" font-family="'Inter',-apple-system,sans-serif" font-size="24" font-weight="700">≋</text>

    <text x="58" y="18" fill="#6EE7B7" font-family="'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace" font-size="12" font-weight="600" letter-spacing="0.12em">LOCAL-FIRST QUANT WORKBENCH</text>
    <text x="58" y="40" fill="#94A3B8" font-family="'Inter',-apple-system,sans-serif" font-size="13">Spot Analysis · Perpetual Auto-Trading · Account PnL · WeChat Bot</text>

    <text x="0" y="104" fill="#F8FAFC" font-family="'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="44" font-weight="800" letter-spacing="-0.02em">Tradebot</text>
    <text x="0" y="142" fill="#CBD5E1" font-family="'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="18" font-weight="400">Deterministic closed-candle crypto research &amp; Binance USDT-M</text>
    <text x="0" y="168" fill="#CBD5E1" font-family="'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="18" font-weight="400">perpetual execution studio with LLM review and WeChat alerts.</text>

