<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Tradebot — Crypto Spot Research and Binance Futures Auto-Trading Workbench">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B1220"/>
      <stop offset="55%" stop-color="#111C2E"/>
      <stop offset="100%" stop-color="#0E2421"/>
    </linearGradient>
    <linearGradient id="lineGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#34D399" stop-opacity="0.25"/>
      <stop offset="45%" stop-color="#10B981" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#6EE7B7" stop-opacity="1"/>
    </linearGradient>
    <linearGradient id="areaGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.26"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="78%" cy="48%" r="42%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#FFFFFF" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="320" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="320" rx="18" fill="url(#grid)"/>
  <rect width="1200" height="320" rx="18" fill="url(#glow)"/>
  <rect x="0.75" y="0.75" width="1198.5" height="318.5" rx="17.25" fill="none" stroke="#FFFFFF" stroke-opacity="0.1" stroke-width="1.5"/>

  <!-- Right-side stylized equity & candle motif -->
  <g transform="translate(710, 44)">
    <rect x="0" y="0" width="438" height="232" rx="14" fill="#0F172A" fill-opacity="0.78" stroke="#334155" stroke-width="1"/>
    <text x="20" y="30" fill="#94A3B8" font-family="'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="12" font-weight="600" letter-spacing="0.08em">S10 DUAL-ENGINE · CLOSED-CANDLE PIPELINE</text>
    <circle cx="412" cy="25" r="5" fill="#10B981"/>

    <!-- Subtle horizontal grid -->
    <line x1="20" y1="68" x2="418" y2="68" stroke="#1E293B" stroke-width="1"/>
    <line x1="20" y1="112" x2="418" y2="112" stroke="#1E293B" stroke-width="1"/>
    <line x1="20" y1="156" x2="418" y2="156" stroke="#1E293B" stroke-width="1"/>
    <line x1="20" y1="198" x2="418" y2="198" stroke="#1E293B" stroke-width="1"/>

